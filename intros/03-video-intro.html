<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardboard Complex, intro 03: video walk-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Oswald:wght@400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap">
<style>
  :root {
    /* palette from the reference page */
    --ground:#1B1512; --panel:#26201B; --line:#3E352E;
    --text:#F3ECD8; --muted:#B5A996; --dim:#7E7264;
    --brick:#8F2C2C; --tan:#C89B62; --gold:#C9A227; --gold-hi:#E7C55A; --navy:#14213D;
    --display:"Playfair Display",Georgia,serif; --label:"Oswald",sans-serif; --body:"Lora",Georgia,serif;

  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--ground); color:var(--text); font-family:var(--body); overflow:hidden; }
  button { font:inherit; cursor:pointer; }

  /* ---------- stage ---------- */
  #stage { position:fixed; inset:0; overflow:hidden; background:var(--ground); }

  /* the intro is a rendered video (see scripts/render-video.js). It cover-fits the viewport; the room takes over on its last frame */
  #intro { position:absolute; inset:0; background:var(--ground); }
  #intro video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- room ---------- */
  #room { position:absolute; inset:0; opacity:0; visibility:hidden; }
  #room-cam { position:absolute; inset:0; will-change:transform; }
  /* the room is laid out in interior render pixels and cover-fitted to the viewport by JS, so stations stay pinned to the picture on any screen */
  #room-img { position:absolute; left:0; top:0; width:2400px; height:1018px; transform-origin:0 0; }
  #room-img img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .station {
    position:absolute; transform:translate(-50%,-50%) scale(var(--ui, 1)); transform-origin:50% 100%;
    background:rgba(27,21,18,.72); color:var(--text); border:1px solid var(--tan);
    font-family:var(--label); font-weight:500; font-size:14px; letter-spacing:.04em; padding:6px 12px;
    backdrop-filter:blur(3px); opacity:0; transition:background .2s, border-color .2s;
  }
  .station::before { content:""; position:absolute; left:50%; top:-16px; width:1px; height:14px; background:var(--tan); }
  .station:hover, .station:focus-visible { background:rgba(201,162,39,.25); border-color:var(--gold-hi); outline:none; }
  #room.focused .station { pointer-events:none; }

  #caption {
    position:absolute; left:24px; right:24px; bottom:28px; max-width:520px;
    background:rgba(27,21,18,.86); border-left:3px solid var(--gold); padding:18px 22px;
    opacity:0; transform:translateY(12px); pointer-events:none;
  }
  #caption h2 { font-family:var(--display); font-size:clamp(22px,3vw,34px); margin:0 0 6px; line-height:1.1; }
  #caption p { margin:0 0 12px; color:var(--muted); font-size:15px; line-height:1.5; }
  #caption button { background:none; border:1px solid var(--line); color:var(--text); font-family:var(--label); padding:6px 12px; }

  /* ---------- chrome ---------- */
  #skip { position:fixed; right:18px; top:18px; z-index:5; background:rgba(27,21,18,.6); color:var(--muted); border:1px solid var(--line); font-family:var(--label); font-size:13px; letter-spacing:.06em; padding:6px 12px; }
  #skip:hover { color:var(--text); border-color:var(--tan); }
  #replay { position:fixed; left:18px; top:18px; z-index:5; background:none; color:var(--dim); border:0; font-family:var(--label); font-size:13px; letter-spacing:.06em; opacity:0; }
  #vignette { position:fixed; inset:0; pointer-events:none; background:radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55)); z-index:3; }

  @media (max-width:600px) {
    .station { font-size:12px; padding:5px 9px; }
    #caption { left:12px; right:12px; bottom:16px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="intro">
    <video id="film" muted playsinline preload="auto" poster="../assets/img/exterior-door-closed.jpg"></video>
  </div>

  <div id="room">
    <div id="room-cam"><div id="room-img">
      <img id="interior" src="../assets/img/interior-wide.jpg" alt="Inside the Cardboard Complex shop">
      <!-- positions are fractions of the interior render, not the viewport -->
      <button class="station" data-station="shelves" style="left:21%; top:40%">The shelves</button>
      <button class="station" data-station="tv"      style="left:50%; top:36%">The screen</button>
      <button class="station" data-station="phone"   style="left:76.5%; top:50%">Your phone</button>
      <button class="station" data-station="counter" style="left:71%; top:57%">The counter</button>
      <button class="station" data-station="vault"   style="left:87.5%; top:44%">Collectors only</button>
    </div></div>
    <div id="caption"><h2></h2><p></p><button id="back">Back to the room</button></div>
  </div>
</div>
<div id="vignette"></div>
<button id="skip">Skip intro</button>
<button id="replay">Replay intro</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  const css = getComputedStyle(document.documentElement);
  const num = v => parseFloat(css.getPropertyValue(v));
  const intro = document.getElementById('intro');
  const film = document.getElementById('film');
  const room = document.getElementById('room');
  const cam = document.getElementById('room-cam');
  const roomImg = document.getElementById('room-img');
  const IW = 2400, IH = 1018;
  // cover-fit the interior render to the viewport; k is the scale, ox/oy the offset of the render's top left corner
  let k = 1, ox = 0, oy = 0;
  function fitRoom() {
    k = Math.max(innerWidth / IW, innerHeight / IH);
    ox = (innerWidth - IW * k) / 2; oy = (innerHeight - IH * k) / 2;
    gsap.set(roomImg, { scale: k, x: ox, y: oy });
    roomImg.style.setProperty('--ui', (1 / k).toFixed(3));
  }
  fitRoom();
  addEventListener('resize', fitRoom);
  const caption = document.getElementById('caption');
  const skipBtn = document.getElementById('skip');
  const replayBtn = document.getElementById('replay');

  // pick the render that matches the screen. Both end on the same interior frame
  const FILMS = {
    landscape: { src: '../video/out/02-walk-in-reveal-landscape', w: 1920, h: 1080 },
    portrait:  { src: '../video/out/02-walk-in-reveal-portrait',  w: 1080, h: 1920 }
  };
  const pick = () => innerHeight > innerWidth ? FILMS.portrait : FILMS.landscape;

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const skipParam = new URLSearchParams(location.search).has('skip');

  // ---------- room navigation ----------
  const stations = {
    shelves: { x: 0.175, y: 0.50, s: 1.9, title: 'Two doors. One shop.', text: 'Every card in the store, and every card in every other store on the platform, in one searchable inventory.' },
    tv:      { x: 0.50, y: 0.48, s: 2.2, title: 'The AIssistants.', text: 'Product demo plays here. The screen is blank in the render on purpose.' },
    phone:   { x: 0.77, y: 0.58, s: 2.4, title: 'All on your phone.', text: 'Collectors and sellers scan, price, list, and buy from the app.' },
    counter: { x: 0.72, y: 0.70, s: 2.0, title: 'Live at the counter.', text: 'Scan a card, see the price, list it before the customer leaves.' },
    vault:   { x: 0.90, y: 0.55, s: 2.1, title: 'Opening soon.', text: 'Trade shows. The door stays shut for now.' }
  };

  function goTo(name) {
    const st = stations[name];
    room.classList.add('focused');
    // station anchor in viewport pixels; scale around it, then slide it toward the viewport center, clamped so the render's edges never show
    const W = innerWidth, H = innerHeight, s = st.s;
    const vx = ox + st.x * IW * k, vy = oy + st.y * IH * k;
    const shift = (v, lo, hi, size) => {
      const lo2 = v + (lo - v) * s, hi2 = v + (hi - v) * s;          // render extent after scaling about v
      return Math.max(size - hi2, Math.min(-lo2, size / 2 - v));    // wanted: center the anchor; allowed: keep edges off screen
    };
    gsap.to(cam, {
      scale: s, transformOrigin: vx + 'px ' + vy + 'px',
      x: shift(vx, ox, ox + IW * k, W), y: shift(vy, oy, oy + IH * k, H),
      duration: 1.1, ease: 'power3.inOut'
    });
    gsap.to('.station', { opacity: 0, duration: .3 });
    caption.querySelector('h2').textContent = st.title;
    caption.querySelector('p').textContent = st.text;
    gsap.to(caption, { opacity: 1, y: 0, pointerEvents: 'auto', duration: .5, delay: .6 });
  }

  function goBack() {
    room.classList.remove('focused');
    gsap.to(cam, { scale: 1, x: 0, y: 0, duration: 1.0, ease: 'power3.inOut' });
    gsap.to(caption, { opacity: 0, y: 12, pointerEvents: 'none', duration: .3 });
    gsap.to('.station', { opacity: 1, duration: .5, delay: .5 });
  }

  document.querySelectorAll('.station').forEach(b => b.addEventListener('click', () => goTo(b.dataset.station)));
  document.getElementById('back').addEventListener('click', goBack);

  // ---------- handoff ----------
  // the film's last frame is the interior cover-fitted to the film's aspect ratio; the room is the interior
  // cover-fitted to the viewport. Start the room camera on the film's crop and let it settle, so nothing jumps.
  function handoff() {
    const f = pick();
    const kv = Math.max(innerWidth / f.w, innerHeight / f.h);             // film cover scale
    const filmIW = IH * f.w / f.h;                                          // interior pixels the film frame spans horizontally
    const ratio = Math.max(1, (f.w * kv) / (filmIW * k));                   // >1 means the film is tighter than the room at rest
    gsap.set(cam, { scale: ratio, transformOrigin: '50% 50%', x: 0, y: 0 });
    gsap.set(room, { visibility: 'visible', opacity: 1 });
    gsap.to(intro, { opacity: 0, duration: .25, onComplete: () => { intro.style.visibility = 'hidden'; film.pause(); } });
    gsap.to(cam, { scale: 1, duration: .9, ease: 'power2.out' });
    gsap.to('.station', { opacity: 1, duration: .6, stagger: .08, delay: .5 });
    gsap.to(replayBtn, { opacity: 1, duration: .4 });
    skipBtn.style.display = 'none';
  }

  let done = false;
  function finish() { if (done) return; done = true; handoff(); }

  function playIntro() {
    done = false;
    gsap.set(room, { visibility: 'hidden', opacity: 0 });
    gsap.set(cam, { scale: 1, x: 0, y: 0 });
    gsap.set('.station', { opacity: 0 });
    gsap.set(replayBtn, { opacity: 0 });
    gsap.set(intro, { visibility: 'visible', opacity: 1 });
    skipBtn.style.display = '';

    if (reduced || skipParam) {
      // no motion: a plain dissolve from the poster into the room
      gsap.set(room, { visibility: 'visible', opacity: 0 });
      gsap.to(room, { opacity: 1, duration: .8 });
      gsap.to(intro, { opacity: 0, duration: .8, onComplete: () => { intro.style.visibility = 'hidden'; } });
      gsap.set('.station', { opacity: 1 }); gsap.set(replayBtn, { opacity: 1 }); skipBtn.style.display = 'none'; done = true;
      return;
    }
    const f = pick();
    if (film.dataset.src !== f.src) {
      film.dataset.src = f.src;
      // mp4 for Safari and most browsers, webm as the fallback (also what headless test browsers can decode)
      film.innerHTML = `<source src="${f.src}.mp4" type="video/mp4"><source src="${f.src}.webm" type="video/webm">`;
      film.lastElementChild.addEventListener('error', finish);   // no source could be played: go straight to the room
      film.load();
    }
    film.currentTime = 0;
    film.play().catch(finish);                                              // autoplay refused: go straight to the room
  }
  film.addEventListener('ended', finish);
  film.addEventListener('error', finish);

  skipBtn.addEventListener('click', finish);
  replayBtn.addEventListener('click', () => { goBack(); playIntro(); });

  playIntro();
})();
</script>
</body>
</html>
